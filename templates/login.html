{% extends "base.html" %}
{% block title %}Login | FoodieHub{% endblock %}
{% block content %}
<div class="auth">
<div class="auth-card">
<h1>Welcome back</h1><p>Login with the email and password you used during registration.</p>
<form method="post">
<label>Email<input type="email" name="email" required></label>

</form>
<div class="demo"><strong>Admin demo</strong><br>admin@foodiehub.com<br>Admin@123</div>
<p class="muted">New customer? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
