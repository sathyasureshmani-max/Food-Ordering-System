{% extends "base.html" %}
{% block title %}Create Account | FoodieHub{% endblock %}
{% block content %}
<div class="auth">
<div class="auth-card">
<h1>Create your account</h1><p>Join FoodieHub and order your favourites.</p>
<form method="post">
<label>Full name<input name="name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Phone<input name="phone" placeholder="10-digit mobile number"></label>
<label>Password<input type="password" name="password" required minlength="6"></label>
<label>Confirm password<input type="password" name="confirm_password" required></label>
<button class="btn full">Create Account</button>
</form>
<p class="muted">Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
</div></div>
{% endblock %}
